#
# Tools pinned outside the package managers that Dependabot reads (Cargo, npm,
# GitHub Actions). `check_versions.py` verifies that every file named in `uses`
# contains the pinned version, and with `--latest` that the pin is the newest
# stable release. Change a version here and in the listed files together.

[rust]
version = "1.100.0"
latest = "rust-stable"
uses = [
  { file = "rust-toolchain.toml", text = 'channel = "{version}"' },
]

[apalache]
version = "0.62.4"
latest = "github:apalache-mc/apalache"
uses = [
  { file = "models/membership/check.py", text = "versions.toml" },
  { file = "models/channels/check.py", text = "versions.toml" },
  { file = "models/calls/check.py", text = "versions.toml" },
  { file = "models/enrollment/check.py", text = "versions.toml" },
  { file = "models/run-inductive.ps1", text = "tools/versions/versions.toml" },
]

[tlc]
version = "1.7.4"
latest = "github:tlaplus/tlaplus"
uses = [
  { file = "models/run-tlc.ps1", text = '$TlaToolsVersion = "{version}"' },
  { file = "models/run-tlc.ps1", text = "releases/download/v{version}/tla2tools.jar" },
]

[cddl]
version = "0.12.14"
latest = "rubygems:cddl"
uses = [
  { file = "tools/cddl/README.md", text = "gem install cddl -v {version}" },
  { file = "docs/spec/appendix-c-cddl.md", text = "gem install cddl -v {version}" },
]

[tamarin]
version = "1.12.0"
latest = "github:tamarin-prover/tamarin-prover"
uses = [
  { file = "proofs/run-tamarin.sh", text = 'TAMARIN_VERSION="{version}"' },
]

[maude]
version = "3.5.1"
latest = "github:maude-lang/Maude"
uses = [
  { file = "proofs/run-tamarin.sh", text = 'MAUDE_VERSION="{version}"' },
]
