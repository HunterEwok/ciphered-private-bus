name: hygiene

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the hygiene checker
        run: python3 -m unittest discover -s .github/scripts
      - name: Check repository, commit, and PR hygiene
        env:
          # Only the maintainer's own pull requests are limited to the maintainer's identities;
          # every contributor is checked for AI tool and bot identities.
          HYGIENE_STRICT_AUTHORS: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'HunterEwok' && '1' || '0' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_hygiene.py
