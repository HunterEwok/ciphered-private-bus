# State machine model checks at the CI sizes (R-VER-2, R-VER-3): safety holds,
# every probe fires, every witness is reached, and the inductive invariants
# prove safety for every reachable state of the instances tiny_ind.

name: models

on:
  push:
    branches: ["main"]
    paths: ["models/**", "tools/versions/versions.toml", ".github/workflows/models.yml"]
  pull_request:
    paths: ["models/**", "tools/versions/versions.toml", ".github/workflows/models.yml"]

permissions:
  contents: read

concurrency:
  group: models-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  membership:
    name: membership (simulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Quint from the lockfile
        working-directory: models
        run: |
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install the Rust evaluator with the job's token
        env:
          GH_TOKEN: ${{ github.token }}
        run: models/fetch-evaluator.sh
      - name: Type check
        working-directory: models/membership
        run: quint typecheck instances.qnt
      - name: Simulate safety, probes, and witnesses
        run: python3 models/membership/check.py simulate

  membership-inductive:
    name: membership (inductive invariant)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Quint from the lockfile
        working-directory: models
        run: |
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prove safety from the inductive invariant (Apalache, instance tiny_ind)
        env:
          # The step obligation needs more than the default heap.
          JVM_ARGS: -Xmx12g
        run: |
          java -version
          python3 models/membership/check.py inductive --main tiny_ind

  membership-convergence:
    name: membership (convergence proof)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Quint from the lockfile
        working-directory: models
        run: |
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prove convergence (Apalache, instances conv_tiny_ind and conv_tiny_pair)
        env:
          # The step obligation needs more than the default heap.
          JVM_ARGS: -Xmx12g
        run: |
          java -version
          python3 models/membership/check.py convergence

  channels:
    name: channels (simulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
