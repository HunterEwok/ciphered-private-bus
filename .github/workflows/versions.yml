# Tool versions pinned outside Dependabot's reach (tools/versions/versions.toml):
# every pull request checks that the listed files agree with the pins; a weekly
# run also fails when a newer stable release exists.

name: versions

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: pinned tool versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the version checker
        run: python3 -m unittest discover -s tools/versions
      - name: Pins agree with the files that use them
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: python3 tools/versions/check_versions.py
      - name: Pins are the newest stable releases
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/versions/check_versions.py --latest
